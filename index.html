<!DOCTYPE html>
<html>
<head>
    <title>Protein calculator</title>
</head>
<body>
    <h1><b>PROTEIN CALCULATOR 9000</b></h1>
    <p>
    price <input id="price" type="text">  $ <br>
    qty <input id="qty" type="text"> 
    <select id="units">
        <option value="lbs">lbs</option>
        <option value="kg">kg</option>
        <option value="g">g</option>
        <option value="oz">oz</option>
    </select> 
    </p>

    <p>
    protein per serving <input id="prots" type="text"> g <br>
    serving size<input id="serving" type="text"> g <br>
    
    <button onclick = "Calculate()">Calculate</button>

    <p id="result">
        
    </p>

    <script src="script.js"></script>
</body>
</html>
